name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if version/tag unchanged'
        required: false
        default: false
        type: boolean

# Prevent concurrent releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Step 1: Check if version actually changed ──────────────────────
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard version consistency
        run: |
          python3 - <<'PY'
          import json
          import tomllib

          with open('package.json', 'r', encoding='utf-8') as f:
              package_version = json.load(f)['version']

          with open('src-tauri/tauri.conf.json', 'r', encoding='utf-8') as f:
              tauri_version = json.load(f)['version']

          with open('src-tauri/Cargo.toml', 'rb') as f:
              cargo_version = tomllib.load(f)['package']['version']

          versions = {
              'package.json': package_version,
              'src-tauri/tauri.conf.json': tauri_version,
              'src-tauri/Cargo.toml': cargo_version,
          }

          if len(set(versions.values())) != 1:
              print('Version mismatch detected:')
              for name, version in versions.items():
                  print(f'  {name}: {version}')
              raise SystemExit(1)

          print(f"Versions are consistent: {package_version}")
          PY

      - name: Guard AUR template integrity
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          def fail(msg: str) -> None:
              print(f"AUR template integrity check failed: {msg}")
              raise SystemExit(1)

          def read_text(path: str) -> str:
              p = Path(path)
              if not p.exists():
                  fail(f"missing required file: {path}")
              return p.read_text(encoding='utf-8')

          def parse_pkgbuild_scalar(text: str, key: str) -> str:
              m = re.search(rf"(?m)^\s*{re.escape(key)}\s*=\s*(.+)$", text)
              if not m:
                  fail(f"{key} not found in PKGBUILD")
              val = m.group(1).strip()
              if (val.startswith("'") and val.endswith("'")) or (val.startswith('"') and val.endswith('"')):
                  return val[1:-1]
              return val

          required_templates = [
              ('aur/shiorii-git/PKGBUILD', 'shiorii-git'),
              ('aur/shiorii-bin/PKGBUILD', 'shiorii-bin'),
          ]

          for pkgbuild_path, expected_pkgname in required_templates:
              text = read_text(pkgbuild_path)
              if not text.strip():
                  fail(f"empty template file: {pkgbuild_path}")

              pkgname = parse_pkgbuild_scalar(text, 'pkgname')
              if pkgname != expected_pkgname:
                  fail(f"{pkgbuild_path} pkgname must be {expected_pkgname}, got: {pkgname}")

              if 'pkgver=' not in text:
                  fail(f"{pkgbuild_path} missing pkgver field")
              if 'pkgrel=' not in text:
                  fail(f"{pkgbuild_path} missing pkgrel field")

              if expected_pkgname == 'shiorii-bin':
                  if 'Shiori_${pkgver}_linux_amd64.tar.gz' not in text:
                      fail(f"{pkgbuild_path} must reference linux amd64 release tarball template")
                  if '/releases/download/v${pkgver}/Shiori_${pkgver}_linux_amd64.tar.gz' not in text:
                      fail(f"{pkgbuild_path} source URL must use versioned release asset template")
                  if 'sha256sums=' not in text:
                      fail(f"{pkgbuild_path} missing sha256sums field")
                  if 'package()' not in text:
                      fail(f"{pkgbuild_path} missing package() function")

              if expected_pkgname == 'shiorii-git':
                  if 'git+https://github.com/vinayydv3695/Shiori.git' not in text:
                      fail(f"{pkgbuild_path} source must point to upstream git repository")

          print('AUR template integrity checks passed')
          PY

      - name: Check if version changed
        id: check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE_SHA="${{ github.event.before }}"
            echo "Comparing against commit: $BEFORE_SHA"

            if git show "${BEFORE_SHA}:package.json" > /tmp/prev-package.json 2>/dev/null; then
              PREV_VERSION=$(node -p "require('/tmp/prev-package.json').version")
            else
              PREV_VERSION="0.0.0"
            fi

            echo "Previous version: $PREV_VERSION"
            if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
              echo "Version changed from $PREV_VERSION to $CURRENT_VERSION"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            elif git ls-remote --tags "https://github.com/vinayydv3695/Shiori-releases.git" "refs/tags/v${CURRENT_VERSION}" | grep -q "refs/tags/v${CURRENT_VERSION}$"; then
              echo "Version unchanged and release tag v${CURRENT_VERSION} already exists on Shiori-releases"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "Version unchanged but release tag v${CURRENT_VERSION} is missing on Shiori-releases; release needed"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_RELEASE="${{ github.event.inputs.force_release }}"
            if [ "$FORCE_RELEASE" = "true" ]; then
              echo "force_release=true, marking version as changed"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            elif git ls-remote --tags "https://github.com/vinayydv3695/Shiori-releases.git" "refs/tags/v${CURRENT_VERSION}" | grep -q "refs/tags/v${CURRENT_VERSION}$"; then
              echo "Release tag v${CURRENT_VERSION} already exists on Shiori-releases"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release tag v${CURRENT_VERSION} does not exist on Shiori-releases"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Unsupported event: ${{ github.event_name }}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Step 2: Build for all platforms ────────────────────────────────
  build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — builds deb, rpm, AppImage
          - platform: ubuntu-22.04
            rust_targets: ''
            args: ''
            include_updater_json: true

          # Windows — builds NSIS installer
          - platform: windows-latest
            rust_targets: ''
            args: ''
            include_updater_json: true

          # macOS — Apple Silicon (M1+)
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            include_updater_json: false

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # ── Sync versions: package.json → tauri.conf.json & Cargo.toml ──
      - name: Sync version to Tauri config
        shell: bash
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          echo "Syncing version $VERSION across all config files"

          # Update tauri.conf.json
          if command -v python3 &> /dev/null; then
            python3 -c "
          import json
          import os
          with open('src-tauri/tauri.conf.json', 'r') as f:
              config = json.load(f)
          config['version'] = '$VERSION'
          
          if os.environ.get('RUNNER_OS') == 'Windows':
              if 'bundle' not in config: config['bundle'] = {}
              res = config['bundle'].get('resources', [])
              if isinstance(res, list):
                  res.extend(['vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll', 'msvcp140_atomic_wait.dll', 'msvcp140_codecvt_ids.dll'])
                  config['bundle']['resources'] = res
          
          with open('src-tauri/tauri.conf.json', 'w') as f:
              json.dump(config, f, indent=2)
              f.write('\n')
          "
          fi

          # Update Cargo.toml version
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          else
            sed -i'' -e "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          fi

      # ── Setup Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # ── Setup Rust ──
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # ── Cache Rust dependencies ──
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          cache-bin: false

      # ── Copy Visual C++ Redist DLLs ──
      - name: Copy Visual C++ Redist DLLs
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dlls = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "msvcp140_atomic_wait.dll", "msvcp140_codecvt_ids.dll")
          foreach ($dll in $dlls) {
            $src = "C:\Windows\System32\$dll"
            if (Test-Path $src) {
              Copy-Item -Path $src -Destination "src-tauri\$dll"
            } else {
              New-Item -Path "src-tauri\$dll" -ItemType File -Force | Out-Null
            }
          }

      # ── Linux system dependencies ──
      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libarchive-tools \
            libspeechd-dev \
            clang \
            libclang-dev

      # ── Install frontend dependencies ──
      - name: Install frontend dependencies
        run: npm ci

      # ── Prepare Tauri Key ──
      - name: Prepare Tauri Key
        shell: bash
        run: |
          RAW_KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}"
          CLEAN_KEY=$(echo "$RAW_KEY" | grep -v "untrusted comment" | tr -d '\n\r ')
          echo "::add-mask::$CLEAN_KEY"
          echo "CLEAN_TAURI_KEY=$CLEAN_KEY" >> $GITHUB_ENV

      # ── Build with Tauri Action (build & bundle only) ──
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.CLEAN_TAURI_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD }}
          VITE_ANILIST_ANDROID_CLIENT_ID: ${{ secrets.VITE_ANILIST_ANDROID_CLIENT_ID }}
          VITE_ANILIST_DESKTOP_CLIENT_ID: ${{ secrets.VITE_ANILIST_DESKTOP_CLIENT_ID }}
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}

      - name: Upload release artifacts to Shiori-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: vinayydv3695/Shiori-releases
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.check-version.outputs.version }}
          name: 'Shiori v${{ needs.check-version.outputs.version }}'
          draft: false
          prerelease: false
          body: |
            ## Shiori v${{ needs.check-version.outputs.version }}

            A modern offline-first library and reading platform for serious personal collections.

            ### Downloads & Installers

            | Platform | File |
            |---|---|
            | **Windows** | `.exe` (NSIS installer) / `.msi` |
            | **macOS (Apple Silicon / Intel)** | `.dmg` |
            | **Linux (Debian/Ubuntu)** | `.deb` |
            | **Linux (Fedora/RHEL)** | `.rpm` |
            | **Linux (Universal)** | `.AppImage` |
            | **Android** | `.apk` |
            | **Arch Linux** | `yay -S shiorii-bin` (AUR) |
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz*
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/*.nsis.zip*
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg.sig
            src-tauri/target/release/bundle/macos/*.app.tar.gz*
          fail_on_unmatched_files: false

      - name: Create and upload Linux AUR tarball
        if: matrix.platform == 'ubuntu-22.04'
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! command -v bsdtar >/dev/null 2>&1; then
            echo "bsdtar is required but not installed. Ensure libarchive-tools is available in this job."
            exit 1
          fi

          DEB_NAME="Shiori_${VERSION}_amd64.deb"
          TAR_NAME="Shiori_${VERSION}_linux_amd64.tar.gz"
          STAGE_DIR="/tmp/shiori-aur-stage-${VERSION}"
          DEB_EXTRACT_DIR="/tmp/shiori-deb-extract-${VERSION}"
          TAR_PATH="/tmp/${TAR_NAME}"

          rm -rf "${STAGE_DIR}" "${DEB_EXTRACT_DIR}" "${TAR_PATH}"
          mkdir -p "${STAGE_DIR}" "${DEB_EXTRACT_DIR}"

          DEB_PATH="$(find src-tauri/target -type f -name "${DEB_NAME}" | head -n 1)"
          if [ -z "${DEB_PATH}" ]; then
            echo "Could not locate ${DEB_NAME}"
            exit 1
          fi

          bsdtar -xf "${DEB_PATH}" -C "${DEB_EXTRACT_DIR}"
          DATA_TAR="$(find "${DEB_EXTRACT_DIR}" -maxdepth 1 -type f -name 'data.tar.*' | head -n 1)"
          if [ -z "${DATA_TAR}" ]; then
            echo "Could not locate data.tar.* in extracted deb payload"
            exit 1
          fi

          bsdtar -xf "${DATA_TAR}" -C "${STAGE_DIR}"
          if [ ! -d "${STAGE_DIR}/usr" ]; then
            echo "Expected usr/ tree not found in deb payload"
            exit 1
          fi

          if [ ! -f "${STAGE_DIR}/usr/bin/shiori" ]; then
            echo "Expected usr/bin/shiori not found in deb payload"
            exit 1
          fi

          if [ ! -f "${STAGE_DIR}/usr/share/applications/Shiori.desktop" ]; then
            echo "Expected usr/share/applications/Shiori.desktop not found in deb payload"
            exit 1
          fi

          tar -C "${STAGE_DIR}" -czf "${TAR_PATH}" usr
          gh release upload "v${VERSION}" "${TAR_PATH}" --repo "vinayydv3695/Shiori-releases" --clobber

  # ── Step 3: Publish updater manifest (latest.json) ──────────────────
  publish-updater:
    name: Publish updater latest.json
    needs: [check-version, build]
    if: |
      needs.check-version.outputs.version_changed == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload latest.json updater manifest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, time
          from datetime import datetime, timezone

          version = os.environ["VERSION"]
          repo = "vinayydv3695/Shiori-releases"
          tag = f"v{version}"

          os.makedirs("/tmp/release-assets", exist_ok=True)

          # ── Wait for all required updater assets to appear on the release ──
          # Each build matrix job uploads independently; GitHub CDN can lag
          # a few seconds even after all jobs finish.  Poll until every
          # platform has both the payload and its .sig file.
          REQUIRED_CHECKS = {
              "linux":       lambda f: f.endswith(".AppImage.tar.gz"),
              "linux_sig":   lambda f: f.endswith(".AppImage.tar.gz.sig"),
              "windows":     lambda f: "nsis.zip" in f and not f.endswith(".sig"),
              "windows_sig": lambda f: "nsis.zip.sig" in f,
              "macos":       lambda f: f.endswith(".app.tar.gz"),
              "macos_sig":   lambda f: f.endswith(".app.tar.gz.sig"),
          }

          files = []
          for attempt in range(1, 21):          # up to ~3 minutes (20 x 10s)
              result = subprocess.run(
                  ["gh", "release", "download", tag, "--repo", repo,
                   "--dir", "/tmp/release-assets", "--clobber"],
                  capture_output=True, text=True,
              )
              if result.returncode != 0:
                  print(f"gh release download failed (attempt {attempt}/20): {result.stderr.strip()}")
              files = os.listdir("/tmp/release-assets")
              missing = [k for k, pred in REQUIRED_CHECKS.items() if not any(pred(f) for f in files)]
              if not missing:
                  print(f"All updater assets present on attempt {attempt}: {sorted(files)}")
                  break
              print(f"Attempt {attempt}/20 – still waiting for: {missing}")
              if attempt < 20:
                  time.sleep(10)
          else:
              missing = [k for k, pred in REQUIRED_CHECKS.items() if not any(pred(f) for f in files)]
              print(f"WARNING: timed out waiting for assets. Still missing: {missing}", file=sys.stderr)

          print(f"Release assets found: {sorted(files)}")
          platforms = {}

          # Linux AppImage
          linux_gz  = next((f for f in files if f.endswith(".AppImage.tar.gz")), None)
          linux_sig = next((f for f in files if f.endswith(".AppImage.tar.gz.sig")), None)
          if linux_gz and linux_sig:
              sig_content = open(f"/tmp/release-assets/{linux_sig}", "r").read().strip()
              platforms["linux-x86_64"] = {
                  "signature": sig_content,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{linux_gz}"
              }
          else:
              print(f"WARNING: Linux updater assets not found (gz={linux_gz}, sig={linux_sig})", file=sys.stderr)

          # Windows NSIS – the critical one; abort if missing so we never
          # publish a latest.json that silently excludes Windows users.
          win_zip = next((f for f in files if "nsis.zip" in f and not f.endswith(".sig")), None)
          win_sig = next((f for f in files if "nsis.zip.sig" in f), None)
          if win_zip and win_sig:
              sig_content = open(f"/tmp/release-assets/{win_sig}", "r").read().strip()
              platforms["windows-x86_64"] = {
                  "signature": sig_content,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{win_zip}"
              }
          else:
              print(f"ERROR: Windows updater assets not found after polling (zip={win_zip}, sig={win_sig}). "
                    "Refusing to upload latest.json without windows-x86_64 — Windows users would never "
                    "see the update popup.", file=sys.stderr)
              sys.exit(1)

          # macOS App bundle
          mac_gz  = next((f for f in files if f.endswith(".app.tar.gz")), None)
          mac_sig = next((f for f in files if f.endswith(".app.tar.gz.sig")), None)
          if mac_gz and mac_sig:
              sig_content = open(f"/tmp/release-assets/{mac_sig}", "r").read().strip()
              platforms["darwin-aarch64"] = {
                  "signature": sig_content,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{mac_gz}"
              }
              platforms["darwin-x86_64"] = {
                  "signature": sig_content,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{mac_gz}"
              }
          else:
              print(f"WARNING: macOS updater assets not found (gz={mac_gz}, sig={mac_sig})", file=sys.stderr)

          latest_json = {
              "version": version,
              "notes": f"Shiori v{version}",
              "pub_date": datetime.now(timezone.utc).isoformat(),
              "platforms": platforms
          }

          print(f"Uploading latest.json with platforms: {list(platforms.keys())}")
          with open("/tmp/latest.json", "w") as f:
              json.dump(latest_json, f, indent=2)

          subprocess.run(["gh", "release", "upload", tag, "/tmp/latest.json", "--repo", repo, "--clobber"], check=True)
          print("Successfully generated and uploaded latest.json for Tauri updater!")
          PY

  # ── Step 3: Update AUR packages after release ──────────────────────
  update-aur:
    name: Update AUR packages
    needs: [check-version, build]
    if: |
      needs.check-version.outputs.version_changed == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH for AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "Missing required secret: AUR_SSH_PRIVATE_KEY"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/aur_id_ed25519
          chmod 600 ~/.ssh/aur_id_ed25519
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Monitor release tarball asset with gh and capture checksum
        id: release-meta
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          ASSET_NAME="Shiori_${VERSION}_linux_amd64.tar.gz"
          SHA256=""

          for attempt in {1..30}; do
            RELEASE_JSON=""
            RELEASE_JSON="$(gh release view "v${VERSION}" --repo "vinayydv3695/Shiori-releases" --json isDraft,assets 2>/dev/null || true)"
            if [ -z "$RELEASE_JSON" ]; then
              echo "Waiting for release v${VERSION} to exist (${attempt}/30)..."
              sleep 20
              continue
            fi

            IS_DRAFT="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("isDraft", True)).lower())' 2>/dev/null || echo "true")"
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Release v${VERSION} is still draft (${attempt}/30)..."
              sleep 20
              continue
            fi

            if ! printf '%s' "$RELEASE_JSON" | ASSET_NAME="$ASSET_NAME" python3 -c 'import json,os,sys; names=[x.get("name","") for x in json.load(sys.stdin).get("assets",[])]; sys.exit(0 if os.environ["ASSET_NAME"] in names else 1)'; then
              echo "Waiting for release asset ${ASSET_NAME} (${attempt}/30)..."
              sleep 20
              continue
            fi

            DIGEST="$(gh release view "v${VERSION}" --repo "vinayydv3695/Shiori-releases" --json assets --jq ".assets[] | select(.name == \"${ASSET_NAME}\") | .digest" 2>/dev/null || true)"
            if [ -n "$DIGEST" ]; then
              SHA256="${DIGEST#sha256:}"
              break
            fi

            gh release download "v${VERSION}" --repo "vinayydv3695/Shiori-releases" --pattern "${ASSET_NAME}" --dir /tmp --clobber
            SHA256="$(sha256sum "/tmp/${ASSET_NAME}" | cut -d' ' -f1)"
            if [ -n "$SHA256" ]; then
              break
            fi

            echo "Waiting for checksum for ${ASSET_NAME} (${attempt}/30)..."
            sleep 20
          done

          if [ -z "$SHA256" ]; then
            echo "Could not determine checksum for ${ASSET_NAME} in release v${VERSION}"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Update shiorii-git (source package)
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur_id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail

          if ! git clone "ssh://aur@aur.archlinux.org/shiorii-git.git"; then
            echo "AUR repo shiorii-git not initialized yet; bootstrapping local repo"
            mkdir -p shiorii-git
            cd shiorii-git
            git init
            git remote add origin "ssh://aur@aur.archlinux.org/shiorii-git.git"
          else
            cd shiorii-git
          fi

          cp "$GITHUB_WORKSPACE/aur/shiorii-git/PKGBUILD" PKGBUILD

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          pkgbuild_path = Path("PKGBUILD")

          pkgbuild = pkgbuild_path.read_text(encoding="utf-8")
          pkgbuild = re.sub(r"^pkgver=.*$", f"pkgver={version}", pkgbuild, flags=re.MULTILINE)
          pkgbuild = re.sub(r"^pkgrel=.*$", "pkgrel=1", pkgbuild, flags=re.MULTILINE)
          pkgbuild_path.write_text(pkgbuild, encoding="utf-8")
          PY

          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/pkg" -w /pkg archlinux:latest bash -lc "makepkg --printsrcinfo > .SRCINFO"

          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "shiorii-git already up to date"
            exit 0
          fi

          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "Update to v${VERSION}"
          git push origin HEAD:master

      - name: Update shiorii-bin (binary package)
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
          SHA256: ${{ steps.release-meta.outputs.sha256 }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur_id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail

          if ! git clone "ssh://aur@aur.archlinux.org/shiorii-bin.git"; then
            echo "AUR repo shiorii-bin not initialized yet; bootstrapping local repo"
            mkdir -p shiorii-bin
            cd shiorii-bin
            git init
            git remote add origin "ssh://aur@aur.archlinux.org/shiorii-bin.git"
          else
            cd shiorii-bin
          fi

          cp "$GITHUB_WORKSPACE/aur/shiorii-bin/PKGBUILD" PKGBUILD

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          sha256 = os.environ["SHA256"]

          pkgbuild_path = Path("PKGBUILD")

          pkgbuild = pkgbuild_path.read_text(encoding="utf-8")
          pkgbuild = re.sub(r"^pkgver=.*$", f"pkgver={version}", pkgbuild, flags=re.MULTILINE)
          pkgbuild = re.sub(r"^pkgrel=.*$", "pkgrel=1", pkgbuild, flags=re.MULTILINE)
          pkgbuild, replacements = re.subn(r"^sha256sums=\(.*\)$", f"sha256sums=('{sha256}')", pkgbuild, flags=re.MULTILINE)

          if replacements != 1:
              raise SystemExit("Expected exactly one sha256sums assignment in PKGBUILD")

          pkgbuild_path.write_text(pkgbuild, encoding="utf-8")
          PY

          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/pkg" -w /pkg archlinux:latest bash -lc "makepkg --printsrcinfo > .SRCINFO"

          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "shiorii-bin already up to date"
            exit 0
          fi

          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "Update to v${VERSION}"
          git push origin HEAD:master

      - name: Verify AUR metadata is updated
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          EXPECTED="${VERSION}-1"

          for attempt in {1..30}; do
            SRC_VERSION="$(curl -fsSL "https://aur.archlinux.org/rpc/v5/info/shiorii-git" | python3 -c 'import json,sys; data=json.load(sys.stdin); results=data.get("results") or []; print(results[0].get("Version", "") if results else "")')"
            BIN_VERSION="$(curl -fsSL "https://aur.archlinux.org/rpc/v5/info/shiorii-bin" | python3 -c 'import json,sys; data=json.load(sys.stdin); results=data.get("results") or []; print(results[0].get("Version", "") if results else "")')"

            echo "Attempt ${attempt}/30 => shiorii-git=${SRC_VERSION}, shiorii-bin=${BIN_VERSION}, expected=${EXPECTED}"

            if [ "$SRC_VERSION" = "$EXPECTED" ] && [ "$BIN_VERSION" = "$EXPECTED" ]; then
              echo "AUR packages updated successfully"
              exit 0
            fi

            sleep 20
          done

          echo "Timed out waiting for AUR metadata to update"
          exit 1

  # ── Step 4: Build for Android ──────────────────────────────────────
  build-android:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        abi:
          - { rust: aarch64-linux-android,    gradle: aarch64, label: arm64-v8a }
          - { rust: armv7-linux-androideabi,  gradle: armv7,   label: armeabi-v7a }
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libspeechd-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.abi.rust }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android NDK
        run: yes | sdkmanager --install "ndk;27.0.12077973"

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: npm run tauri android init

      # Version-stable compile cache. Keyed on Rust sources ONLY, so a version
      # bump (Cargo.toml/Cargo.lock churn) never invalidates it — otherwise
      # every release rebuilds both ABIs cold (~1h on the shared runner).
      # Real source changes still bust the key and refresh the cache.
      - name: Restore cargo target cache
        uses: actions/cache@v4
        with:
          path: src-tauri/target/${{ matrix.abi.rust }}/release
          key: android-cargo-${{ matrix.abi.gradle }}-${{ hashFiles('src-tauri/src/**/*.rs') }}
          restore-keys: |
            android-cargo-${{ matrix.abi.gradle }}-

      - name: Android build disk headroom
        run: |
          df -h / | tail -1
          echo "NDK size: $(du -sh "$ANDROID_HOME/ndk/27.0.12077973" 2>/dev/null | cut -f1)"

      - name: Build Android App (APK) — ${{ matrix.abi.label }}
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          VITE_ANILIST_ANDROID_CLIENT_ID: ${{ secrets.VITE_ANILIST_ANDROID_CLIENT_ID }}
          VITE_ANILIST_DESKTOP_CLIENT_ID: ${{ secrets.VITE_ANILIST_DESKTOP_CLIENT_ID }}
        # One ABI per job: the aarch64 and armv7 builds run on SEPARATE
        # runners in parallel, so they never contend for disk (the old
        # single job building both interleaved was killed twice on the
        # runner's ~14GB: two concurrent target trees + NDK + Gradle).
        # x86/x86_64 are emulator-only and never built.
        run: |
          npm run tauri android build -- --apk --split-per-abi --target ${{ matrix.abi.gradle }}
          df -h / | tail -1

      - name: Sign Android APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using production keystore from GitHub Secrets"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            KEY_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            ALIAS="${ANDROID_KEY_ALIAS}"
          else
            echo "No production keystore found in secrets. Using checked-in debug.keystore..."
            cp src-tauri/debug.keystore release.keystore
            KEY_PASS="android"
            ALIAS="androiddebugkey"
          fi

          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
          # Find the highest version of build-tools
          APKSIGNER=$(ls -1d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)/apksigner
          for apk in $(find "$APK_DIR" -name '*-unsigned.apk' -type f 2>/dev/null); do
            SIGNED_APK="${apk/-unsigned/}"
            cp "$apk" "$SIGNED_APK"
            "$APKSIGNER" sign --ks release.keystore --ks-pass "pass:$KEY_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$ALIAS" "$SIGNED_APK"
          done

      - name: Upload Android APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ needs.check-version.outputs.version }}"
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
          for apk in $(find "$APK_DIR" -name '*.apk' ! -name '*-unsigned.apk' -type f 2>/dev/null); do
            echo "Uploading: $apk"
            gh release upload "$VERSION" "$apk" --repo "vinayydv3695/Shiori-releases" --clobber || true
          done


  # ── Step 5: Build for iOS ──────────────────────────────────────────
  build-ios:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri iOS project
        run: npm run tauri ios init

      - name: Build iOS App (Simulator - unsigned)
        env:
          # Skip code signing for CI - no Apple Developer account needed
          TAURI_APPLE_DEVELOPMENT_TEAM: ''
        run: |
          # Patch the Xcode project to disable code signing (using perl for better cross-platform newline support)
          PBXPROJ="src-tauri/gen/apple/shiori.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            perl -pi -e 's/CODE_SIGN_IDENTITY = ".*"/CODE_SIGN_IDENTITY = "-"/g' "$PBXPROJ"
            perl -pi -e 's/PRODUCT_BUNDLE_IDENTIFIER/CODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER/g' "$PBXPROJ"
          fi
          # Build for simulator (no signing required)
          npm run tauri ios build -- --target aarch64-sim

      - name: Compress iOS .app to zip
        run: |
          APP_DIR=$(find src-tauri/gen/apple/build -name '*.app' -type d | head -1)
          if [ -n "$APP_DIR" ]; then
            cd "$(dirname "$APP_DIR")"
            zip -r Shiori-ios-simulator.app.zip "$(basename "$APP_DIR")"
          fi

      - name: Upload iOS App to Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          ZIP_FILE=$(find src-tauri/gen/apple/build -name '*.zip' -type f | head -1)
          if [ -n "$ZIP_FILE" ]; then
            gh release upload "v${VERSION}" "$ZIP_FILE" --repo "vinayydv3695/Shiori-releases" --clobber || true
          else
            echo "No iOS app zip found - skipping upload"
          fi
