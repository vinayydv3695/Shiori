# open-library-extension — WASM extension for Open Library book search.
#
# Implements the host ABI in `src-tauri/src/extensions/{abi,runtime,host}.rs`:
# exports `memory`/`alloc(i32)->i32`/`invoke(i32,i32)->i32`, JSON envelopes
# over length-prefixed linear memory, and only the `shiori.*` host imports
# that the host actually registers (network goes through `host_http_fetch`).
#
# Copy of the reference template `extensions/torrents-csv-extension/` with
# the source-specific parts adapted for openlibrary.org. Standalone crate on
# purpose: the empty `[workspace]` table below keeps it out of any parent
# workspace, so `cargo check/build` here never touches the app. Build for
# `wasm32-unknown-unknown`.

[package]
name = "open-library-extension"
version = "0.1.0"
edition = "2021"
description = "Shiori WASM source — Open Library book search (https://openlibrary.org/search.json)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# No reqwest / scraper / regex: all HTTP goes through host functions, all JSON
# parsing is local (serde_json) so the module stays lean for wasm32.

[profile.release]
# WASM guests have no unwinder; abort on the (should-never-happen) panic.
panic = "abort"
# Reference module: size matters more than peak speed.
opt-level = "s"
lto = true

[workspace]