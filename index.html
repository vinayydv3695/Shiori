<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' asset: http://asset.localhost https: http: blob: data: shiori-proxy: http://shiori-proxy.localhost https://shiori-proxy.localhost http://cloud.feedly.com https://cloud.feedly.com http://*.feedly.com https://*.feedly.com http://storage.googleapis.com https://storage.googleapis.com http://*.googleapis.com https://*.googleapis.com; media-src 'self' asset: http://asset.localhost blob: data:; font-src 'self' asset: http://asset.localhost data:; connect-src 'self' ipc: http://ipc.localhost http://asset.localhost https://asset.localhost ws://localhost:5173 http://localhost:5173 http://127.0.0.1:5173 http://10.0.2.2:5173 http://shiori-proxy.localhost http://cloud.feedly.com https://cloud.feedly.com http://*.feedly.com https://*.feedly.com http://storage.googleapis.com https://storage.googleapis.com http://*.googleapis.com https://*.googleapis.com https://www.googleapis.com https://openlibrary.org https://covers.openlibrary.org https://graphql.anilist.co https://gutendex.com https://api.github.com; worker-src 'self' blob:" />
    <title>shiori</title>
    
    <!-- Local fonts (bundled for production Tauri build, no CDN dependency) -->
    <link rel="stylesheet" href="/fonts/fonts.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--background, #fbf7ee);
        color: var(--foreground, #222);
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: transparent;
        overflow: hidden;
      }
      #native-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Painted at boot by the inline script below — app theme color,
           defaulting to the app's default sepia. No more white/dark flash. */
        background: #e5d6b6;
        transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
      }
      #native-splash img {
        width: 8rem;
        height: 8rem;
        object-fit: contain;
        transition: transform 0.5s ease-in-out, opacity 0.5s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div id="native-splash">
      <img src="/logo.png" alt="Shiori Logo" />
    </div>
    <div id="root"></div>
    <script>
      // Boot theming BEFORE first paint: read the theme the app cached on its
      // last session (preferencesStore.syncThemeColor writes 'shiori-boot-theme')
      // and paint the splash + window strip with it immediately — this is what
      // eliminates the white-flash and makes the splash match the user's theme
      // (sepia/dark/paper/…) instead of a hardcoded black.
      (function () {
        try {
          var cached = null;
          try { cached = JSON.parse(localStorage.getItem('shiori-boot-theme') || 'null'); } catch (e) { /* ignore */ }
          var bg = (cached && typeof cached.bg === 'string' && /^#[0-9a-fA-F]{6}$/.test(cached.bg)) ? cached.bg : '#e5d6b6';
          var splash = document.getElementById('native-splash');
          if (splash) splash.style.background = bg;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', bg);
        } catch (e) { /* never break boot over theming */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
